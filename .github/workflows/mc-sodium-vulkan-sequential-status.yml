name: Track sequential Sodium Vulkan benchmark

on:
  push:
    paths:
      - '.github/workflows/mc-sodium-vulkan-sequential-status.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit current run status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p benchmark-results
          gh run list --workflow mc-sodium-vulkan-sequential.yml --limit 1 --json databaseId,status,conclusion,createdAt,headSha > benchmark-results/sodium-vulkan-sequential-live.json
          cat benchmark-results/sodium-vulkan-sequential-live.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add benchmark-results/sodium-vulkan-sequential-live.json
          git commit -m 'Record Sodium Vulkan sequential live status' || true
          git push || true
