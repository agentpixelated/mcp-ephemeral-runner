name: test-ytdlp-pot

on:
  push:
    branches: [render/fractal-20m-20260909]
    paths:
      - '.github/workflows/test-ytdlp-pot.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install current yt-dlp and PO-token plugin
        run: |
          python -m pip install -U pip
          python -m pip install -U 'yt-dlp[default]' bgutil-ytdlp-pot-provider
          yt-dlp --version
      - name: Start BgUtils PO-token provider
        run: |
          docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider:latest
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4416/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker ps --filter name=bgutil-provider
      - name: Verify provider is discovered
        run: |
          yt-dlp -v --simulate \
            --js-runtimes node --remote-components ejs:github \
            --extractor-args 'youtube:player_client=mweb' \
            'https://www.youtube.com/watch?v=gB9n2gHsHN4' 2>&1 | tee pot_simulate.log
      - name: Download a short low-res reference sample
        run: |
          mkdir -p pot_test
          yt-dlp -v --no-playlist \
            --js-runtimes node --remote-components ejs:github \
            --extractor-args 'youtube:player_client=mweb' \
            -f 'best[height<=360]/best' \
            --download-sections '*00:00:20-00:00:35' --force-keyframes-at-cuts \
            -o 'pot_test/reference.%(ext)s' \
            'https://www.youtube.com/watch?v=gB9n2gHsHN4' 2>&1 | tee pot_download.log
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json pot_test/reference.* > pot_test/ffprobe.json
          cp pot_simulate.log pot_test/
          cp pot_download.log pot_test/
      - uses: actions/upload-artifact@v4
        with:
          name: ytdlp-pot-test
          path: pot_test
          retention-days: 2
