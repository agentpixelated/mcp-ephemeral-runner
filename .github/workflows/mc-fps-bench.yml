name: Temporary Minecraft Fabric FPS benchmark

on:
  push:
    paths:
      - '.github/workflows/mc-fps-bench.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MC_VERSION: '1.21.1'
  DISPLAY: ':99'
  LIBGL_ALWAYS_SOFTWARE: '1'
  MESA_GL_VERSION_OVERRIDE: '4.6'
  ALSOFT_DRIVERS: 'null'

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jre xvfb xdotool mesa-utils jq curl python3-pip imagemagick libgl1-mesa-dri libglx-mesa0
          python3 -m pip install --break-system-packages 'portablemc==4.4.1'
          echo 'JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64' >> "$GITHUB_ENV"
          echo '/usr/lib/jvm/java-21-openjdk-amd64/bin' >> "$GITHUB_PATH"
          /usr/lib/jvm/java-21-openjdk-amd64/bin/java -version

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 854x480x24 -ac +extension GLX +render -noreset >xvfb.log 2>&1 &
          sleep 2
          glxinfo -B | tee glxinfo.txt
          java -version

      - name: Download benchmark mods from Modrinth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.minecraft/mods" "$GITHUB_WORKSPACE/modcache"
          cat > /tmp/modfetch.py <<'PY'
          import json, os, urllib.parse, urllib.request
          MC='1.21.1'; LOADER='fabric'; out=os.environ['GITHUB_WORKSPACE']+'/modcache'
          os.makedirs(out, exist_ok=True)
          aliases={'fpstest':'Cfyw5WXC','fabric-api':'fabric-api','sodium':'sodium','immediatelyfast':'immediatelyfast','entityculling':'entityculling','moreculling':'moreculling','lithium':'lithium','ferritecore':'ferrite-core','c2me':'c2me-fabric'}
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'mc-fps-bench/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          def project(key):
              ident=aliases.get(key,key)
              try:return get('https://api.modrinth.com/v2/project/'+urllib.parse.quote(ident,safe=''))
              except Exception:
                  data=get('https://api.modrinth.com/v2/search?'+urllib.parse.urlencode({'query':ident,'limit':10}))
                  for h in data.get('hits',[]):
                      if h.get('slug','').lower()==ident.lower() or h.get('title','').lower()==key.lower():return h
                  raise
          def versions(pid):
              q=urllib.parse.urlencode({'loaders':json.dumps([LOADER]),'game_versions':json.dumps([MC])})
              return get(f'https://api.modrinth.com/v2/project/{pid}/version?{q}')
          def resolve(key,bucket):
              p=project(key);pid=p['id']
              if pid in bucket:return
              vs=versions(pid)
              if not vs:raise RuntimeError(f'No Fabric {MC} version for {key}')
              v=next((x for x in vs if x.get('version_type')=='release'),vs[0])
              f=next((x for x in v['files'] if x.get('primary')),v['files'][0]);fn=f['filename'];path=os.path.join(out,fn)
              if not os.path.exists(path):
                  print('DOWNLOAD',key,v.get('version_number'),fn,flush=True)
                  req=urllib.request.Request(f['url'],headers={'User-Agent':'mc-fps-bench/1.0'})
                  with urllib.request.urlopen(req,timeout=120) as r,open(path,'wb') as w:w.write(r.read())
              bucket[pid]={'key':key,'project_id':pid,'version_id':v['id'],'version':v.get('version_number'),'file':fn}
              for d in v.get('dependencies',[]):
                  if d.get('dependency_type')!='required':continue
                  if d.get('version_id'):
                      dv=get('https://api.modrinth.com/v2/version/'+d['version_id']);dp=get('https://api.modrinth.com/v2/project/'+dv['project_id']);resolve(dp['slug'],bucket)
                  elif d.get('project_id'):
                      dp=get('https://api.modrinth.com/v2/project/'+d['project_id']);resolve(dp['slug'],bucket)
          roots=['fabric-api','fpstest','sodium','immediatelyfast','entityculling','moreculling','lithium','ferritecore','c2me']; manifests={}
          for root in roots:
              b={};resolve(root,b);manifests[root]=list(b.values())
          with open(out+'/manifest.json','w') as f:json.dump(manifests,f,indent=2)
          print(json.dumps(manifests,indent=2))
          PY
          python3 /tmp/modfetch.py

      - name: Prepare Sodium-only control
        run: |
          rm -f "$HOME/.minecraft/mods"/*.jar
          python3 - <<'PY'
          import json,os,shutil
          root=os.environ['GITHUB_WORKSPACE']+'/modcache';m=json.load(open(root+'/manifest.json'));files={}
          for group in ('fabric-api','fpstest','sodium'):
              for x in m[group]:files[x['file']]=x
          for fn in files:
              shutil.copy2(root+'/'+fn,os.path.expanduser('~/.minecraft/mods/'+fn));print('USE',fn)
          PY
          ls -lh "$HOME/.minecraft/mods"

      - name: Configure deterministic client options
        run: |
          mkdir -p "$HOME/.minecraft"
          cat > "$HOME/.minecraft/options.txt" <<'EOF'
          fullscreen:false
          enableVsync:false
          maxFps:260
          renderDistance:8
          simulationDistance:8
          guiScale:2
          pauseOnLostFocus:false
          graphicsMode:0
          clouds:false
          entityDistanceScaling:1.0
          mipmapLevels:4
          narrator:0
          EOF

      - name: Sodium-only benchmark smoke test
        shell: bash
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/screens" "$GITHUB_WORKSPACE/results/baseline"
          rm -rf "$HOME/.minecraft/fpstest-reports"
          find "$HOME/.minecraft" -name report.json -delete 2>/dev/null || true
          portablemc start -u BenchUser fabric:1.21.1 > "$GITHUB_WORKSPACE/client-baseline.log" 2>&1 &
          MC_PID=$!
          WID=''
          for i in $(seq 1 240); do
            WID=$(xdotool search --onlyvisible --name 'Minecraft' 2>/dev/null | head -n1)
            [ -n "$WID" ] && break
            if ! kill -0 "$MC_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ -z "$WID" ]; then echo 'No Minecraft window'; tail -n 300 "$GITHUB_WORKSPACE/client-baseline.log"; exit 2; fi
          sleep 15
          import -window root "$GITHUB_WORKSPACE/screens/01-main.png" || true

          # Open FPS Test directly from the title screen.
          xdotool mousemove 735 28 click 1
          sleep 4
          import -window root "$GITHUB_WORKSPACE/screens/02-fpstest-menu.png" || true

          # Click the visible TEST MY FPS / Base FPS Benchmark button.
          xdotool mousemove 426 310 click 1
          sleep 10
          import -window root "$GITHUB_WORKSPACE/screens/03-benchmark-start.png" || true

          FOUND=''
          for i in $(seq 1 420); do
            FOUND=$(find "$HOME/.minecraft" -name report.json -type f 2>/dev/null | head -n1)
            [ -n "$FOUND" ] && break
            if ! kill -0 "$MC_PID" 2>/dev/null; then break; fi
            if [ $((i%60)) -eq 0 ]; then import -window root "$GITHUB_WORKSPACE/screens/progress-$i.png" || true; fi
            sleep 1
          done
          import -window root "$GITHUB_WORKSPACE/screens/04-final.png" || true
          find "$HOME/.minecraft" -maxdepth 4 -type f \( -name 'report*' -o -name 'fps.csv' -o -name 'session.csv' -o -name 'system.json' \) -print | tee "$GITHUB_WORKSPACE/report-files.txt"
          if [ -n "$FOUND" ]; then
            echo "REPORT=$FOUND"; cp -a "$(dirname "$FOUND")"/. "$GITHUB_WORKSPACE/results/baseline/"; cat "$FOUND"; RC=0
          else
            echo 'Benchmark report not produced.'; tail -n 400 "$GITHUB_WORKSPACE/client-baseline.log"; RC=3
          fi
          kill -TERM "$MC_PID" 2>/dev/null || true; sleep 3; kill -KILL "$MC_PID" 2>/dev/null || true
          exit $RC

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-fps-smoke-v2
          path: |
            screens/
            results/
            client-baseline.log
            glxinfo.txt
            xvfb.log
            report-files.txt
            modcache/manifest.json
          if-no-files-found: warn
          retention-days: 2
