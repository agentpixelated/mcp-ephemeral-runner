name: Record forced Sodium Vulkan smoke result

on:
  workflow_run:
    workflows: ["Minecraft 26.2 Sodium forced Vulkan smoke benchmark"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download forced Vulkan smoke artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p out benchmark-results
          gh run download "$RUN_ID" -n sodium-forced-vulkan-smoke -D out || true
          cp out/client.log benchmark-results/mc-26.2-sodium-forced-vulkan-client.log 2>/dev/null || true
          cp out/backend-proof.txt benchmark-results/mc-26.2-sodium-forced-vulkan-backend.txt 2>/dev/null || true
          cp out/vulkaninfo.txt benchmark-results/mc-26.2-sodium-vulkaninfo.txt 2>/dev/null || true
          if [ -f out/result.json ] && grep -qiE 'Using graphics backend Vulkan|graphics backend.*Vulkan|Vulkan.*(device|backend)' out/client.log && ! grep -qi 'Using graphics backend OpenGL' out/client.log; then
            cp out/result.json benchmark-results/mc-26.2-sodium-forced-vulkan-smoke.json
            printf '{"sodium_forced_vulkan_run_id":"%s","state":"complete","valid_vulkan":true}\n' "$RUN_ID" > benchmark-results/sodium-forced-vulkan-status.json
          else
            printf '{"sodium_forced_vulkan_run_id":"%s","state":"complete","valid_vulkan":false}\n' "$RUN_ID" > benchmark-results/sodium-forced-vulkan-status.json
          fi
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add benchmark-results/
          git commit -m 'Record forced Minecraft 26.2 Sodium Vulkan smoke result' || true
          git push || true
