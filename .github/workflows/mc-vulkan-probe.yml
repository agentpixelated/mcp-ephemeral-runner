name: Probe Minecraft 26.2 graphics arguments

on:
  push:
    paths:
      - '.github/workflows/mc-vulkan-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Inspect official 26.2 client Main
        run: |
          set -euo pipefail
          mkdir -p probe benchmark-results
          python3 - <<'PY'
          import json, urllib.request
          m=json.load(urllib.request.urlopen('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'))
          u=next(x['url'] for x in m['versions'] if x['id']=='26.2')
          v=json.load(urllib.request.urlopen(u))
          print('metadata',u)
          print('client',v['downloads']['client']['url'])
          urllib.request.urlretrieve(v['downloads']['client']['url'],'probe/client.jar')
          if 'client_mappings' in v.get('downloads',{}):
              urllib.request.urlretrieve(v['downloads']['client_mappings']['url'],'probe/client_mappings.txt')
          PY
          {
            echo '=== MAIN CLASS STRINGS ==='
            unzip -p probe/client.jar net/minecraft/client/main/Main.class 2>/dev/null | strings | grep -Ei -C3 'vulkan|graphics|validation|backend|api' || true
            echo
            echo '=== JAVAP MAIN ==='
            javap -classpath probe/client.jar -p -c -verbose net.minecraft.client.main.Main 2>&1 | grep -Ei -C8 'vulkan|graphics|validation|backend|accepts|force' || true
            echo
            echo '=== ALL RELEVANT CLASS STRINGS ==='
            for c in net/minecraft/client/main/Main.class net/minecraft/client/Options.class net/minecraft/client/PreferredGraphicsApi.class; do
              echo "--- $c"
              unzip -p probe/client.jar "$c" 2>/dev/null | strings | grep -Ei -C3 'vulkan|graphics|validation|backend|opengl|force' || true
            done
            echo
            echo '=== MAPPING HINTS ==='
            grep -Ei -C2 'Main|PreferredGraphicsApi|forcedGraphicsApi|vulkanValidation|preferredGraphicsBackend' probe/client_mappings.txt 2>/dev/null | head -400 || true
          } | tee benchmark-results/mc-26.2-graphics-probe.txt
      - name: Commit probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add benchmark-results/mc-26.2-graphics-probe.txt
          git commit -m 'Record Minecraft 26.2 graphics argument probe' || true
          git push || true
