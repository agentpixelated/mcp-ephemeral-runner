name: CU transfer 010-011
on:
  push:
    paths: ['.github/workflows/cu-transfer-probe.yml']
permissions:
  actions: write
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Clear previous relay artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=cu-pair-008-009" --jq '.artifacts[].id' | xargs -r -I{} gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/{}"
      - name: Read public source ranges
        run: |
          u='https://drive.usercontent.google.com/download?id=1E5vu4m9WlSX8q4QYnCrx4boVRnYaBy3h&export=download&confirm=t'
          curl -fL -H 'Range: bytes=2348810240-2579496959' "$u" -o part_010.bin
          curl -fL -H 'Range: bytes=2579496960-2810183679' "$u" -o part_011.bin
          test "$(stat -c %s part_010.bin)" = 230686720
          test "$(stat -c %s part_011.bin)" = 230686720
          sha256sum part_010.bin part_011.bin > hashes.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cu-pair-010-011
          path: |
            part_010.bin
            part_011.bin
            hashes.sha256
          compression-level: 0
          retention-days: 1
