name: CU publish visual review JPGs
on:
  push:
    paths: ['.github/workflows/cu-transfer-probe.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish-review-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download completed review artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf _review review/images
          mkdir -p _review review/images/overview review/images/candidates
          gh run download 34686298310 -n cu-visual-review-parallel -D _review
          cp _review/nav_*.jpg review/images/overview/
          cp _review/candidates/*.jpg review/images/candidates/
      - name: Commit temporary visual evidence
        run: |
          rm -rf _review
          git config user.name 'agentic-video-bot'
          git config user.email 'agentic-video-bot@users.noreply.github.com'
          git add review/images
          git commit -m 'temporarily publish C:U review JPGs' || exit 0
          git push
