name: CU transfer chunks 004-005

on:
  push:
    paths:
      - '.github/workflows/cu-transfer-probe.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delete previous artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE /repos/${{ github.repository }}/actions/artifacts/10295351357 || true
          gh api --method DELETE /repos/${{ github.repository }}/actions/artifacts/10295231745 || true

      - name: Fetch chunks 004 and 005
        shell: bash
        run: |
          set -euo pipefail
          URL='https://drive.usercontent.google.com/download?id=1E5vu4m9WlSX8q4QYnCrx4boVRnYaBy3h&export=download&confirm=t'
          fetch_part() {
            NAME="$1"; START="$2"; END="$3"; EXPECTED="$4"
            curl --fail --location --retry 3 --retry-all-errors -H "Range: bytes=${START}-${END}" "$URL" -o "${NAME}.bin"
            SIZE=$(stat -c '%s' "${NAME}.bin")
            echo "${NAME} size=${SIZE}"
            test "$SIZE" -eq "$EXPECTED"
            sha256sum "${NAME}.bin" | tee "${NAME}.sha256"
          }
          fetch_part part_004 964689920 1195376639 230686720
          fetch_part part_005 1195376640 1426063359 230686720

      - name: Upload chunk 004
        uses: actions/upload-artifact@v4
        with:
          name: cu-part-004
          path: |
            part_004.bin
            part_004.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload chunk 005
        uses: actions/upload-artifact@v4
        with:
          name: cu-part-005
          path: |
            part_005.bin
            part_005.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
