name: CU transfer probe

on:
  push:
    paths:
      - '.github/workflows/cu-transfer-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch 8 MiB public Drive range
        shell: bash
        run: |
          set -euo pipefail
          URL='https://drive.usercontent.google.com/download?id=1E5vu4m9WlSX8q4QYnCrx4boVRnYaBy3h&export=download&confirm=t'
          curl --fail --location --retry 3 --retry-all-errors \
            -H 'Range: bytes=0-8388607' "$URL" -o probe.bin
          SIZE=$(stat -c '%s' probe.bin)
          echo "size=$SIZE"
          test "$SIZE" -eq 8388608
          sha256sum probe.bin | tee probe.sha256
      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: cu-drive-probe-8m
          path: |
            probe.bin
            probe.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
