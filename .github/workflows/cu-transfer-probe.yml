name: CU transfer 014-015
on:
  push:
    paths: ['.github/workflows/cu-transfer-probe.yml']
permissions:
  actions: write
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Clear previous relay artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=cu-pair-012-013" --jq '.artifacts[].id' | xargs -r -I{} gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/{}"
      - name: Read public source ranges
        run: |
          u='https://drive.usercontent.google.com/download?id=1E5vu4m9WlSX8q4QYnCrx4boVRnYaBy3h&export=download&confirm=t'
          curl -fL -H 'Range: bytes=3271557120-3502243839' "$u" -o part_014.bin
          curl -fL -H 'Range: bytes=3502243840-3732930559' "$u" -o part_015.bin
          test "$(stat -c %s part_014.bin)" = 230686720
          test "$(stat -c %s part_015.bin)" = 230686720
          sha256sum part_014.bin part_015.bin > hashes.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cu-pair-014-015
          path: |
            part_014.bin
            part_015.bin
            hashes.sha256
          compression-level: 0
          retention-days: 1
