name: CU transfer chunks 006-007

on:
  push:
    paths:
      - '.github/workflows/cu-transfer-probe.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delete previous artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE /repos/${{ github.repository }}/actions/artifacts/10295291676 || true
          gh api --method DELETE /repos/${{ github.repository }}/actions/artifacts/10295306691 || true

      - name: Fetch chunks 006 and 007
        shell: bash
        run: |
          set -euo pipefail
          URL='https://drive.usercontent.google.com/download?id=1E5vu4m9WlSX8q4QYnCrx4boVRnYaBy3h&export=download&confirm=t'
          fetch_part() {
            NAME="$1"; START="$2"; END="$3"; EXPECTED="$4"
            curl --fail --location --retry 3 --retry-all-errors -H "Range: bytes=${START}-${END}" "$URL" -o "${NAME}.bin"
            SIZE=$(stat -c '%s' "${NAME}.bin")
            echo "${NAME} size=${SIZE}"
            test "$SIZE" -eq "$EXPECTED"
            sha256sum "${NAME}.bin" | tee "${NAME}.sha256"
          }
          fetch_part part_006 1426063360 1656750079 230686720
          fetch_part part_007 1656750080 1887436799 230686720

      - name: Upload chunk 006
        uses: actions/upload-artifact@v4
        with:
          name: cu-part-006
          path: |
            part_006.bin
            part_006.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload chunk 007
        uses: actions/upload-artifact@v4
        with:
          name: cu-part-007
          path: |
            part_007.bin
            part_007.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
