name: Minecraft 26.2 Sodium Vulkan sequential benchmark

on:
  push:
    paths:
      - '.github/workflows/mc-sodium-vulkan-sequential.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  DISPLAY: ':99'
  ALSOFT_DRIVERS: 'null'

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Prepare Vulkan runtime
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages -q 'portablemc==4.4.1'
          sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 xdotool
          echo 'Vulkan ICDs:'
          ls -la /usr/share/vulkan/icd.d
          Xvfb :99 -screen 0 854x480x24 -ac -noreset >xvfb.log 2>&1 &
          sleep 2

      - name: Download all benchmark mods for 26.2
        run: |
          mkdir -p modcache
          python3 - <<'PY'
          import json,urllib.parse,urllib.request,os
          mc='26.2';out='modcache';seen={}
          aliases={'fabric-api':'fabric-api','sodium':'sodium','immediatelyfast':'immediatelyfast','entityculling':'entityculling','moreculling':'moreculling','lithium':'lithium','ferritecore':'ferrite-core','c2me':'c2me-fabric'}
          def get(u):
              return json.load(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'sodium-vulkan-sequential/1'}),timeout=30))
          def add(slug):
              p=get('https://api.modrinth.com/v2/project/'+urllib.parse.quote(slug,safe=''))
              if p['id'] in seen:return
              q=urllib.parse.urlencode({'loaders':json.dumps(['fabric']),'game_versions':json.dumps([mc])})
              vs=get(f"https://api.modrinth.com/v2/project/{p['id']}/version?{q}")
              if not vs: raise RuntimeError('No 26.2 Fabric build for '+slug)
              v=next((x for x in vs if x.get('version_type')=='release'),vs[0]);f=next((x for x in v['files'] if x.get('primary')),v['files'][0])
              fn=f['filename'];urllib.request.urlretrieve(f['url'],out+'/'+fn);seen[p['id']]={'slug':p['slug'],'file':fn,'version':v['version_number']}
              print('USE',p['slug'],v['version_number'],fn)
              for d in v.get('dependencies',[]):
                  if d.get('dependency_type')=='required' and d.get('project_id'):
                      add(get('https://api.modrinth.com/v2/project/'+d['project_id'])['slug'])
          manifests={}
          for k,s in aliases.items():
              before=set(seen);add(s);new=[x for pid,x in seen.items() if pid not in before];manifests[k]=new
          json.dump(manifests,open(out+'/manifest.json','w'),indent=2)
          PY
          cat modcache/manifest.json

      - name: Build direct frame logger
        run: |
          git clone -q --depth 1 --branch 26.2 https://github.com/FabricMC/fabric-example-mod.git framebench
          cd framebench
          rm -rf src/main/java src/client/java src/main/resources/* src/client/resources/*
          mkdir -p src/client/java/bench src/main/resources
          sed -i 's/"modid"/"framebench"/g' build.gradle
          cat > src/main/resources/fabric.mod.json <<'EOF'
          {"schemaVersion":1,"id":"framebench","version":"1.0.0","name":"FrameBench","environment":"client","entrypoints":{"client":["bench.FrameBenchClient"]},"depends":{"fabricloader":">=0.19.3","minecraft":"~26.2","java":">=25","fabric-api":"*"}}
          EOF
          cat > src/client/java/bench/FrameBenchClient.java <<'JAVA'
          package bench;
          import java.nio.file.*;import java.util.*;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.rendering.v1.level.LevelRenderEvents;
          import net.fabricmc.loader.api.FabricLoader;
          public final class FrameBenchClient implements ClientModInitializer{
            static final long DUR=10_000_000_000L;static final List<Long> f=new ArrayList<>();static boolean a=false,d=false;static long s,l;static Path t,r;static String c;
            public void onInitializeClient(){Path g=FabricLoader.getInstance().getGameDir();c=System.getenv().getOrDefault("BENCH_CONFIG","unknown");t=g.resolve("benchmark.trigger");r=g.resolve("bench-result.json");try{Files.deleteIfExists(t);Files.deleteIfExists(r);}catch(Exception e){}LevelRenderEvents.END_MAIN.register(x->frame());System.out.println("FRAMEBENCH READY "+c);}
            static void frame(){if(d)return;long n=System.nanoTime();if(!a){if(Files.exists(t)){a=true;s=l=n;f.clear();System.out.println("FRAMEBENCH START");}return;}if(n-s<DUR){long q=n-l;l=n;if(q>0&&q<2_000_000_000L)f.add(q);return;}d=true;write();}
            static long p(List<Long>x,double q){int i=(int)Math.ceil(q*x.size())-1;return x.get(Math.max(0,Math.min(x.size()-1,i)));}
            static void write(){try{List<Long>x=new ArrayList<>(f);Collections.sort(x);long z=0;for(long q:f)z+=q;double m=f.size()*1e9/z,med=1e9/p(x,.5),lo=1e9/p(x,.99),lo01=1e9/p(x,.999);String j=String.format(Locale.ROOT,"{\"config\":\"%s\",\"samples\":%d,\"mean_fps\":%.4f,\"median_fps\":%.4f,\"one_percent_low_fps\":%.4f,\"zero_point_one_percent_low_fps\":%.4f,\"p99_frame_ms\":%.4f}\n",c,f.size(),m,med,lo,lo01,p(x,.99)/1e6);Files.writeString(r,j);System.out.println("FRAMEBENCH DONE "+j);}catch(Exception e){e.printStackTrace();}}
          }
          JAVA
          ./gradlew build --no-daemon -q
          cp $(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -1) ../modcache/framebench.jar

      - name: Generate one fixed world template
        run: |
          mkdir worldgen && cd worldgen
          python3 - <<'PY'
          import json,urllib.request
          m=json.load(urllib.request.urlopen('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'));u=next(x['url'] for x in m['versions'] if x['id']=='26.2');v=json.load(urllib.request.urlopen(u));urllib.request.urlretrieve(v['downloads']['server']['url'],'server.jar')
          PY
          echo eula=true > eula.txt
          printf 'level-name=benchworld\nlevel-seed=7608123456789\ngamemode=creative\ndifficulty=peaceful\nonline-mode=false\nview-distance=8\nsimulation-distance=6\n' > server.properties
          java -Xms1G -Xmx2G -jar server.jar nogui >server.log 2>&1 & pid=$!
          for i in $(seq 1 90);do grep -q 'Done (' server.log&&break;sleep 1;done
          grep 'Done (' server.log;kill -TERM $pid||true;sleep 2
          mkdir -p ../world-template;cp -a benchworld/. ../world-template/

      - name: Resolve Fabric metadata and inject Vulkan launch argument
        run: |
          mkdir -p "$HOME/.minecraft/mods"
          cp modcache/*.jar "$HOME/.minecraft/mods/" 2>/dev/null || true
          set +e
          timeout 45s portablemc start -u BenchUser fabric:26.2 >resolve.log 2>&1 & p=$!
          for i in $(seq 1 45);do find "$HOME/.minecraft/versions" -name '*26.2*.json' 2>/dev/null|grep -q .&&break;sleep 1;done
          kill -TERM $p 2>/dev/null||true;pkill -f 'KnotClient|net.minecraft.client.main.Main' 2>/dev/null||true;sleep 2;set -e
          python3 - <<'PY'
          import glob,json,os
          ps=glob.glob(os.path.expanduser('~/.minecraft/versions/**/*26.2*.json'),recursive=True);n=0
          for p in ps:
              try:d=json.load(open(p))
              except:continue
              a=d.setdefault('arguments',{}).setdefault('game',[])
              if '--graphicsBackend' not in a:a+=['--graphicsBackend','vulkan']
              json.dump(d,open(p,'w'),indent=2);print('PATCHED',p);n+=1
          if not n:raise SystemExit('No metadata patched')
          PY

      - name: Run 14 configurations sequentially
        run: |
          cat > "$HOME/.minecraft/options.txt" <<'EOF'
          fullscreen:false
          enableVsync:false
          maxFps:260
          renderDistance:8
          simulationDistance:6
          guiScale:2
          pauseOnLostFocus:false
          graphicsMode:0
          clouds:false
          entityDistanceScaling:1.0
          mipmapLevels:2
          narrator:0
          bobView:false
          EOF
          mkdir -p sequential-results logs "$HOME/.minecraft/saves"
          cat > configs.json <<'EOF'
          [
            ["sodium_vulkan",["fabric-api","sodium"]],
            ["sodium_vulkan_immediatelyfast",["fabric-api","sodium","immediatelyfast"]],
            ["sodium_vulkan_entityculling",["fabric-api","sodium","entityculling"]],
            ["sodium_vulkan_moreculling",["fabric-api","sodium","moreculling"]],
            ["sodium_vulkan_lithium",["fabric-api","sodium","lithium"]],
            ["sodium_vulkan_ferritecore",["fabric-api","sodium","ferritecore"]],
            ["sodium_vulkan_c2me",["fabric-api","sodium","c2me"]],
            ["sodium_vulkan_if_mc",["fabric-api","sodium","immediatelyfast","moreculling"]],
            ["sodium_vulkan_if_lithium",["fabric-api","sodium","immediatelyfast","lithium"]],
            ["sodium_vulkan_mc_lithium",["fabric-api","sodium","moreculling","lithium"]],
            ["sodium_vulkan_if_mc_lithium",["fabric-api","sodium","immediatelyfast","moreculling","lithium"]],
            ["sodium_vulkan_ec_mc_lithium",["fabric-api","sodium","entityculling","moreculling","lithium"]],
            ["sodium_vulkan_full_no_c2me",["fabric-api","sodium","immediatelyfast","entityculling","moreculling","lithium","ferritecore"]],
            ["sodium_vulkan_full",["fabric-api","sodium","immediatelyfast","entityculling","moreculling","lithium","ferritecore","c2me"]]
          ]
          EOF
          python3 - <<'PY'
          import json,os,glob,shutil,subprocess,time
          root=os.getcwd();home=os.path.expanduser('~/.minecraft');manifest=json.load(open('modcache/manifest.json'));configs=json.load(open('configs.json'))
          rows=[]
          def sh(cmd):return subprocess.run(cmd,shell=True,executable='/bin/bash')
          for name,groups in configs:
              print('\n===== '+name+' =====',flush=True)
              md=home+'/mods';os.makedirs(md,exist_ok=True)
              for p in glob.glob(md+'/*.jar'):os.remove(p)
              files=[]
              for g in groups:
                  for item in manifest[g]:
                      src='modcache/'+item['file'];dst=md+'/'+item['file']
                      if not os.path.exists(dst):shutil.copy2(src,dst)
                      files.append(item['file'])
              shutil.copy2('modcache/framebench.jar',md+'/framebench.jar')
              save=home+'/saves/benchworld';shutil.rmtree(save,ignore_errors=True);shutil.copytree('world-template',save)
              for p in [home+'/benchmark.trigger',home+'/bench-result.json']:
                  try:os.remove(p)
                  except:pass
              env=os.environ.copy();env['BENCH_CONFIG']=name
              logp='logs/'+name+'.log';log=open(logp,'w')
              proc=subprocess.Popen(['portablemc','start','-u','BenchUser','fabric:26.2'],stdout=log,stderr=subprocess.STDOUT,env=env)
              wid=''
              valid=False
              for _ in range(100):
                  txt=open(logp,errors='ignore').read() if os.path.exists(logp) else ''
                  if 'Failed to create backend Vulkan' in txt or 'Using graphics backend OpenGL' in txt:break
                  if 'Using graphics backend Vulkan' in txt:valid=True
                  r=subprocess.run("xdotool search --onlyvisible --name Minecraft 2>/dev/null | head -1",shell=True,text=True,capture_output=True,env=env);wid=r.stdout.strip()
                  if wid and valid:break
                  if proc.poll() is not None:break
                  time.sleep(1)
              if not valid:
                  rows.append({'config':name,'status':'invalid_vulkan'});proc.terminate();log.close();continue
              if not wid:
                  rows.append({'config':name,'status':'no_window'});proc.terminate();log.close();continue
              sh(f'xdotool windowactivate {wid} || true');time.sleep(7)
              sh('xdotool mousemove 427 235 click 1');time.sleep(4)
              sh('xdotool mousemove 315 120 click 1');time.sleep(1)
              sh('xdotool mousemove 270 395 click 1');time.sleep(35)
              open(home+'/benchmark.trigger','w').close()
              for _ in range(4):
                  sh('xdotool keydown w');time.sleep(1.2);sh('xdotool keyup w');sh('xdotool mousemove_relative -- 100 0');time.sleep(.8);sh('xdotool keydown d');time.sleep(.7);sh('xdotool keyup d');time.sleep(.3)
              result=home+'/bench-result.json'
              for _ in range(20):
                  if os.path.exists(result):break
                  time.sleep(1)
              if os.path.exists(result):
                  d=json.load(open(result));d['mods']=groups;d['vulkan_proven']=True;rows.append(d);json.dump(d,open('sequential-results/'+name+'.json','w'),indent=2);print('RESULT',d,flush=True)
              else:rows.append({'config':name,'status':'no_result'})
              proc.terminate()
              try:proc.wait(timeout=6)
              except:proc.kill()
              log.close();time.sleep(2)
          json.dump(rows,open('sequential-results/raw.json','w'),indent=2)
          PY

      - name: Aggregate and commit results
        run: |
          mkdir -p benchmark-results
          python3 - <<'PY'
          import csv,json
          rows=json.load(open('sequential-results/raw.json'));good=[x for x in rows if 'mean_fps' in x]
          base=next((x for x in good if x['config']=='sodium_vulkan'),None)
          for r in good:
              if base:r['vs_sodium_vulkan_pct']=round((r['mean_fps']/base['mean_fps']-1)*100,3)
          good.sort(key=lambda x:x['mean_fps'],reverse=True)
          payload={'minecraft':'26.2','renderer':'Sodium native Vulkan','same_runner':True,'valid_results':len(good),'results':good,'failures':[x for x in rows if 'mean_fps' not in x]}
          json.dump(payload,open('benchmark-results/mc-26.2-sodium-vulkan-sequential.json','w'),indent=2)
          fields=['config','mods','samples','mean_fps','median_fps','one_percent_low_fps','zero_point_one_percent_low_fps','p99_frame_ms','vs_sodium_vulkan_pct','vulkan_proven']
          with open('benchmark-results/mc-26.2-sodium-vulkan-sequential.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();[w.writerow({k:r.get(k,'') for k in fields}) for r in good]
          print(json.dumps(payload,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add benchmark-results/mc-26.2-sodium-vulkan-sequential.json benchmark-results/mc-26.2-sodium-vulkan-sequential.csv
          git commit -m 'Record sequential Sodium Vulkan benchmark results' || true
          git push || true

      - name: Upload sequential diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sodium-vulkan-sequential
          path: |
            sequential-results/
            logs/
            xvfb.log
          if-no-files-found: warn
          retention-days: 2
