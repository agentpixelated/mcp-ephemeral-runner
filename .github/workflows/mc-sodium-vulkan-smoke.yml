name: Minecraft 26.2 Sodium forced Vulkan smoke benchmark

on:
  push:
    paths:
      - '.github/workflows/mc-sodium-vulkan-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DISPLAY: ':99'
  ALSOFT_DRIVERS: 'null'
  VK_LOADER_DEBUG: 'error'

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Vulkan runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool python3-pip imagemagick git vulkan-tools mesa-vulkan-drivers libvulkan1
          python3 -m pip install --break-system-packages 'portablemc==4.4.1'
          Xvfb :99 -screen 0 854x480x24 -ac -noreset >xvfb.log 2>&1 &
          sleep 2
          vulkaninfo --summary | tee vulkaninfo.txt

      - name: Fetch Sodium and Fabric API
        run: |
          mkdir -p "$HOME/.minecraft/mods" modcache
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          mc='26.2'
          def get(u):
              r=urllib.request.Request(u,headers={'User-Agent':'mc-sodium-vulkan-forced-smoke/2.0'})
              return json.load(urllib.request.urlopen(r,timeout=30))
          seen=set()
          def add(slug):
              p=get('https://api.modrinth.com/v2/project/'+urllib.parse.quote(slug,safe=''))
              if p['id'] in seen:return
              q=urllib.parse.urlencode({'loaders':json.dumps(['fabric']),'game_versions':json.dumps([mc])})
              vs=get(f"https://api.modrinth.com/v2/project/{p['id']}/version?{q}")
              if not vs: raise RuntimeError('No 26.2 Fabric build for '+slug)
              v=next((x for x in vs if x.get('version_type')=='release'),vs[0]); seen.add(p['id'])
              f=next((x for x in v['files'] if x.get('primary')),v['files'][0])
              urllib.request.urlretrieve(f['url'],'modcache/'+f['filename'])
              print('USE',p['slug'],v['version_number'],f['filename'])
              for d in v.get('dependencies',[]):
                  if d.get('dependency_type')=='required' and d.get('project_id'):
                      dp=get('https://api.modrinth.com/v2/project/'+d['project_id']); add(dp['slug'])
          add('fabric-api'); add('sodium')
          PY
          cp modcache/*.jar "$HOME/.minecraft/mods/"

      - name: Build frame logger
        run: |
          git clone -q --depth 1 --branch 26.2 https://github.com/FabricMC/fabric-example-mod.git framebench
          cd framebench
          rm -rf src/main/java src/client/java src/main/resources/* src/client/resources/*
          mkdir -p src/client/java/bench src/main/resources
          sed -i 's/"modid"/"framebench"/g' build.gradle
          cat > src/main/resources/fabric.mod.json <<'EOF'
          {"schemaVersion":1,"id":"framebench","version":"1.0.0","name":"FrameBench","environment":"client","entrypoints":{"client":["bench.FrameBenchClient"]},"depends":{"fabricloader":">=0.19.3","minecraft":"~26.2","java":">=25","fabric-api":"*"}}
          EOF
          cat > src/client/java/bench/FrameBenchClient.java <<'JAVA'
          package bench;
          import java.nio.file.*; import java.util.*;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.rendering.v1.level.LevelRenderEvents;
          import net.fabricmc.loader.api.FabricLoader;
          public final class FrameBenchClient implements ClientModInitializer {
            static final long DUR=15_000_000_000L; static final List<Long> f=new ArrayList<>();
            static boolean active=false,done=false; static long start,last; static Path trigger,result;
            public void onInitializeClient(){Path g=FabricLoader.getInstance().getGameDir();trigger=g.resolve("benchmark.trigger");result=g.resolve("bench-result.json");try{Files.deleteIfExists(trigger);Files.deleteIfExists(result);}catch(Exception ignored){}System.out.println("FRAMEBENCH READY");LevelRenderEvents.END_MAIN.register(c->frame());}
            static void frame(){if(done)return;long n=System.nanoTime();if(!active){if(Files.exists(trigger)){active=true;start=last=n;f.clear();System.out.println("FRAMEBENCH START");}return;}if(n-start<DUR){long d=n-last;last=n;if(d>0&&d<2_000_000_000L)f.add(d);return;}done=true;write();}
            static long p(List<Long>s,double q){int i=(int)Math.ceil(q*s.size())-1;return s.get(Math.max(0,Math.min(s.size()-1,i)));}
            static void write(){try{List<Long>s=new ArrayList<>(f);Collections.sort(s);long sum=0;for(long x:f)sum+=x;double mean=f.size()*1e9/sum,med=1e9/p(s,.5),low1=1e9/p(s,.99),low01=1e9/p(s,.999);String j=String.format(Locale.ROOT,"{\"config\":\"sodium_forced_vulkan\",\"samples\":%d,\"mean_fps\":%.4f,\"median_fps\":%.4f,\"one_percent_low_fps\":%.4f,\"zero_point_one_percent_low_fps\":%.4f,\"p99_frame_ms\":%.4f}\n",f.size(),mean,med,low1,low01,p(s,.99)/1e6);Files.writeString(result,j);System.out.println("FRAMEBENCH DONE "+j);}catch(Exception e){e.printStackTrace();}}
          }
          JAVA
          ./gradlew build --no-daemon -q
          cp $(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -1) "$HOME/.minecraft/mods/framebench.jar"

      - name: Make fixed world
        run: |
          mkdir worldgen && cd worldgen
          python3 - <<'PY'
          import json,urllib.request
          m=json.load(urllib.request.urlopen('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'))
          u=next(x['url'] for x in m['versions'] if x['id']=='26.2');v=json.load(urllib.request.urlopen(u));urllib.request.urlretrieve(v['downloads']['server']['url'],'server.jar')
          PY
          echo eula=true > eula.txt
          printf 'level-name=benchworld\nlevel-seed=7608123456789\ngamemode=creative\ndifficulty=peaceful\nonline-mode=false\nview-distance=8\nsimulation-distance=6\n' > server.properties
          java -Xms1G -Xmx2G -jar server.jar nogui >server.log 2>&1 & pid=$!
          for i in $(seq 1 90); do grep -q 'Done (' server.log && break; sleep 1; done
          grep 'Done (' server.log
          kill -TERM $pid || true
          sleep 2
          mkdir -p "$HOME/.minecraft/saves/benchworld"
          cp -a benchworld/. "$HOME/.minecraft/saves/benchworld/"

      - name: Install client metadata then inject forced Vulkan argument
        run: |
          set +e
          # First invocation is only to make PortableMC resolve/download the Fabric metadata.
          timeout 55s portablemc start -u BenchUser fabric:26.2 >install-pass.log 2>&1 & ip=$!
          for i in $(seq 1 55); do
            ls "$HOME/.minecraft/versions"/*26.2*/*.json >/dev/null 2>&1 && break
            sleep 1
          done
          sleep 5
          kill -TERM $ip 2>/dev/null || true
          pkill -f 'net.fabricmc.loader.impl.launch.knot.KnotClient' 2>/dev/null || true
          pkill -f 'net.minecraft.client.main.Main' 2>/dev/null || true
          sleep 2
          set -e
          python3 - <<'PY'
          import glob,json,os
          paths=glob.glob(os.path.expanduser('~/.minecraft/versions/*26.2*/*.json'))
          print('VERSION JSONS',*paths,sep='\n')
          patched=[]
          for p in paths:
              try:d=json.load(open(p))
              except Exception:continue
              args=d.setdefault('arguments',{})
              game=args.setdefault('game',[])
              # Avoid duplicates when the file is inherited/rewritten.
              if '--graphicsBackend' not in game:
                  game += ['--graphicsBackend','vulkan']
              with open(p,'w') as f:json.dump(d,f,indent=2)
              patched.append(p)
          if not patched: raise SystemExit('No 26.2 metadata JSON was patched')
          print('PATCHED',*patched,sep='\n')
          for p in patched:
              d=json.load(open(p)); print(p, d.get('arguments',{}).get('game'))
          PY

      - name: Run and validate forced Vulkan
        run: |
          cat > "$HOME/.minecraft/options.txt" <<'EOF'
          fullscreen:false
          enableVsync:false
          maxFps:260
          renderDistance:8
          simulationDistance:6
          guiScale:2
          pauseOnLostFocus:false
          graphicsMode:0
          clouds:false
          entityDistanceScaling:1.0
          mipmapLevels:2
          narrator:0
          bobView:false
          preferredGraphicsBackend:"vulkan"
          EOF
          set +e
          timeout 220s portablemc start -u BenchUser fabric:26.2 >client.log 2>&1 & p=$!
          wid=''
          for i in $(seq 1 120); do wid=$(xdotool search --onlyvisible --name Minecraft 2>/dev/null | head -1); [ -n "$wid" ] && break; kill -0 $p 2>/dev/null || break; sleep 1; done
          sleep 6
          grep -Ei 'graphics backend|Vulkan|OpenGL|graphics device|renderer' client.log | tail -100 | tee backend-proof.txt || true
          if grep -qi 'Using graphics backend OpenGL' client.log; then
            echo 'INVALID: Minecraft fell back to OpenGL despite --graphicsBackend vulkan'
            kill -TERM $p 2>/dev/null || true
            exit 31
          fi
          if ! grep -qiE 'Using graphics backend Vulkan|Vulkan.*(device|backend)|graphics backend.*Vulkan' client.log; then
            echo 'INVALID: no proof of Vulkan backend'
            kill -TERM $p 2>/dev/null || true
            exit 32
          fi
          [ -n "$wid" ] || { echo 'NO WINDOW'; tail -300 client.log; exit 21; }
          xdotool windowactivate "$wid" || true
          sleep 6
          xdotool mousemove 427 235 click 1
          sleep 5
          xdotool mousemove 315 120 click 1
          sleep 1
          xdotool mousemove 270 395 click 1
          sleep 45
          import -window root world-loaded.png || true
          touch "$HOME/.minecraft/benchmark.trigger"
          for n in $(seq 1 6); do xdotool keydown w; sleep 1.2; xdotool keyup w; xdotool mousemove_relative -- 100 0; sleep .8; xdotool keydown d; sleep .7; xdotool keyup d; sleep .3; done
          for i in $(seq 1 25); do [ -f "$HOME/.minecraft/bench-result.json" ] && break; sleep 1; done
          [ -f "$HOME/.minecraft/bench-result.json" ] || { echo 'NO RESULT'; tail -300 client.log; exit 22; }
          cat "$HOME/.minecraft/bench-result.json"
          cp "$HOME/.minecraft/bench-result.json" result.json
          kill -TERM $p 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sodium-forced-vulkan-smoke
          path: |
            result.json
            client.log
            install-pass.log
            backend-proof.txt
            world-loaded.png
            vulkaninfo.txt
            xvfb.log
          if-no-files-found: warn
          retention-days: 2
