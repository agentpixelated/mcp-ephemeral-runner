name: Fetch Modrinth 26.1.2 mods

on:
  push:
    paths:
      - '.github/workflows/modrinth-download.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Fabric 26.1.2 mods from Modrinth only
        run: python scripts/fetch_modrinth_2612.py
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-26.1.2-Fabric-Modrinth-Only
          path: Minecraft-26.1.2-Fabric-Modrinth-Only.zip
          if-no-files-found: error
          retention-days: 1
