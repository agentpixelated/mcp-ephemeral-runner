name: Fetch Modrinth 26.1.2 mods

on:
  push:
    paths:
      - '.github/workflows/modrinth-download.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download requested mods only from Modrinth
        shell: python
        run: |
          import json, os, re, hashlib, urllib.parse, urllib.request, zipfile, time
          from pathlib import Path

          GAME = '26.1.2'
          LOADER = 'fabric'
          OUT = Path('mods-26.1.2')
          OUT.mkdir(exist_ok=True)

          requested = [
              ('BadOptimizations', ['BadOptimizations', 'badoptimizations']),
              ('Better Block Entities', ['Better Block Entities', 'better-block-entities', 'bbe']),
              ('BetterF3', ['BetterF3', 'betterf3']),
              ('Cloth Config API', ['Cloth Config API', 'cloth-config']),
              ('Drippy Loading Screen', ['Drippy Loading Screen', 'drippy-loading-screen']),
              ('Entity Model Features', ['Entity Model Features', 'entity-model-features']),
              ('Entity Texture Features', ['Entity Texture Features', 'entitytexturefeatures']),
              ('Fabric API', ['Fabric API', 'fabric-api']),
              ('FancyMenu', ['FancyMenu', 'fancymenu']),
              ('Fast IP Ping', ['Fast IP Ping', 'fast-ip-ping']),
              ('FerriteCore', ['FerriteCore', 'ferrite-core']),
              ('ImmediatelyFast', ['ImmediatelyFast', 'immediatelyfast']),
              ('Iris Shaders', ['Iris Shaders', 'iris']),
              ('Konkrete', ['Konkrete', 'konkrete']),
              ('LambDynamicLights', ['LambDynamicLights', 'lambdynamiclights']),
              ('Lithium', ['Lithium', 'lithium']),
              ('Melody', ['Melody', 'melody']),
              ('More Culling', ['More Culling', 'moreculling']),
              ('Mouse Tweaks', ['Mouse Tweaks', 'mouse-tweaks']),
              ('Reimagined Intro', ['Reimagined Intro', 'reimagined-intro']),
              ('Sodium Extra', ['Sodium Extra', 'sodium-extra']),
              ('Sodium', ['Sodium', 'sodium']),
              ('WaterMedia', ['WaterMedia', 'watermedia']),
              ('WaterMedia Binaries', ['WaterMedia Binaries', 'watermedia binaries', 'watermedia-binaries']),
          ]

          # Deliberately omitted: floodgate-spigot.jar (server plugin, not a Fabric mod)
          # and tl_skin_cape (not sourced from Modrinth).

          UA = {'User-Agent': 'ChatGPT-Modrinth-Pack-Builder/1.0 (Minecraft 26.1.2)'}

          def get_json(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=45) as r:
                  return json.load(r)

          def norm(s):
              return re.sub(r'[^a-z0-9]+', '', s.lower())

          def find_project(label, aliases):
              for q in aliases:
                  url = 'https://api.modrinth.com/v2/search?' + urllib.parse.urlencode({
                      'query': q,
                      'limit': 20,
                      'facets': '[["project_type:mod"]]'
                  })
                  data = get_json(url)
                  hits = data.get('hits', [])
                  # exact title/slug match first
                  targets = {norm(label), *(norm(a) for a in aliases)}
                  exact = [h for h in hits if norm(h.get('title','')) in targets or norm(h.get('slug','')) in targets]
                  if exact:
                      return exact[0]
                  if hits:
                      # conservative fuzzy: all normalized label tokens must appear in title/slug
                      lt = norm(label)
                      for h in hits:
                          hs = norm(h.get('title','') + h.get('slug',''))
                          if lt and lt in hs:
                              return h
              return None

          def versions_for(project_id):
              params = urllib.parse.urlencode({
                  'loaders': json.dumps([LOADER]),
                  'game_versions': json.dumps([GAME])
              })
              return get_json(f'https://api.modrinth.com/v2/project/{project_id}/version?{params}')

          def choose_version(versions):
              if not versions:
                  return None
              rank = {'release': 0, 'beta': 1, 'alpha': 2}
              versions.sort(key=lambda v: (rank.get(v.get('version_type'), 9), v.get('date_published','')), reverse=False)
              # within best channel, newest publication
              best_rank = min(rank.get(v.get('version_type'), 9) for v in versions)
              candidates = [v for v in versions if rank.get(v.get('version_type'), 9) == best_rank]
              return max(candidates, key=lambda v: v.get('date_published',''))

          manifest = {'game_version': GAME, 'loader': LOADER, 'source_policy': 'Modrinth only', 'mods': [], 'skipped': [], 'errors': []}
          downloaded_project_ids = set()
          dependency_queue = []

          def download_version(label, project, ver, requested_directly=True):
              pid = project['project_id'] if 'project_id' in project else project.get('id')
              if pid in downloaded_project_ids:
                  return
              files = ver.get('files', [])
              primary = next((f for f in files if f.get('primary') and f.get('filename','').endswith('.jar')), None)
              if primary is None:
                  primary = next((f for f in files if f.get('filename','').endswith('.jar')), None)
              if primary is None:
                  manifest['errors'].append({'name': label, 'reason': 'No JAR in compatible Modrinth version', 'version_id': ver.get('id')})
                  return
              url = primary['url']
              host = urllib.parse.urlparse(url).hostname or ''
              if not (host == 'cdn.modrinth.com' or host.endswith('.modrinth.com')):
                  manifest['errors'].append({'name': label, 'reason': f'Rejected non-Modrinth file host: {host}'})
                  return
              dest = OUT / primary['filename']
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=120) as r, open(dest, 'wb') as w:
                  while True:
                      b = r.read(1024*1024)
                      if not b: break
                      w.write(b)
              expected = primary.get('hashes',{}).get('sha512')
              actual = hashlib.sha512(dest.read_bytes()).hexdigest()
              if expected and actual.lower() != expected.lower():
                  dest.unlink(missing_ok=True)
                  raise RuntimeError(f'SHA-512 mismatch for {primary["filename"]}')
              downloaded_project_ids.add(pid)
              manifest['mods'].append({
                  'name': label,
                  'project_id': pid,
                  'project_slug': project.get('slug'),
                  'version_number': ver.get('version_number'),
                  'version_id': ver.get('id'),
                  'version_type': ver.get('version_type'),
                  'filename': primary['filename'],
                  'url': url,
                  'sha512': actual,
                  'direct_request': requested_directly
              })
              for dep in ver.get('dependencies', []):
                  if dep.get('dependency_type') == 'required' and dep.get('project_id'):
                      dependency_queue.append(dep['project_id'])

          for label, aliases in requested:
              try:
                  project = find_project(label, aliases)
                  if not project:
                      manifest['skipped'].append({'name': label, 'reason': 'No matching Modrinth mod project found'})
                      continue
                  versions = versions_for(project['project_id'])
                  ver = choose_version(versions)
                  if not ver:
                      manifest['skipped'].append({'name': label, 'project': project.get('slug'), 'reason': f'No Fabric version explicitly compatible with {GAME} on Modrinth'})
                      continue
                  download_version(label, project, ver, True)
              except Exception as e:
                  manifest['errors'].append({'name': label, 'reason': repr(e)})
              time.sleep(0.08)

          # Resolve required Modrinth dependencies recursively, still only from Modrinth.
          seen_dep = set()
          while dependency_queue:
              pid = dependency_queue.pop(0)
              if pid in seen_dep or pid in downloaded_project_ids:
                  continue
              seen_dep.add(pid)
              try:
                  project = get_json(f'https://api.modrinth.com/v2/project/{pid}')
                  versions = versions_for(pid)
                  ver = choose_version(versions)
                  if ver:
                      download_version(project.get('title', pid), project, ver, False)
                  else:
                      manifest['errors'].append({'name': project.get('title',pid), 'reason': f'Required dependency has no Fabric {GAME} version'})
              except Exception as e:
                  manifest['errors'].append({'name': pid, 'reason': f'Dependency resolution failed: {e!r}'})

          manifest['skipped'].extend([
              {'name': 'Floodgate Spigot', 'reason': 'Not downloaded: server plugin, request restricted to Modrinth mods only'},
              {'name': 'TL Skin & Cape', 'reason': 'Not downloaded: no Modrinth source accepted under source policy'}
          ])

          (OUT / 'MODRINTH_MANIFEST.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          (OUT / 'README.txt').write_text(
              'Minecraft 26.1.2 Fabric mods. Every included JAR was downloaded directly from a Modrinth-hosted URL and SHA-512 verified when provided.\n'
              'Do not place multiple Sodium versions in the mods folder; this bundle selects one latest compatible stable channel version.\n'
              'See MODRINTH_MANIFEST.json for exact source URLs, version IDs, hashes, skips and errors.\n',
              encoding='utf-8'
          )
          with zipfile.ZipFile('Minecraft-26.1.2-Fabric-Modrinth-Only.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for p in OUT.rglob('*'):
                  if p.is_file(): z.write(p, p.relative_to(OUT.parent))
          print(json.dumps(manifest, indent=2))

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-26.1.2-Fabric-Modrinth-Only
          path: Minecraft-26.1.2-Fabric-Modrinth-Only.zip
          if-no-files-found: error
          retention-days: 1
