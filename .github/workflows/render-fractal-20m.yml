name: render-fractal-20m

on:
  push:
    branches:
      - render/fractal-20m-20260909
    paths:
      - 'fractal_video/**'
      - '.github/workflows/render-fractal-20m.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ffmpeg libcairo2-dev libpango1.0-dev pkg-config python3-dev \
            texlive-latex-base texlive-latex-extra dvisvgm \
            fonts-dejavu-core espeak-ng

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'manim==0.21.0' kokoro-onnx soundfile
          manim --version

      - name: Download Kokoro open-weight model
        working-directory: fractal_video
        run: |
          wget -q --show-progress https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.int8.onnx
          wget -q --show-progress https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin

      - name: Generate neural voice-over and timings
        working-directory: fractal_video
        run: python voice.py

      - name: Render actual Manim scene
        working-directory: fractal_video
        run: |
          manim -r 1280,720 --fps 24 fractal_video.py FractalExplainer
          find media -type f -name 'FractalExplainer.mp4' -print

      - name: Mux, normalize and compress final video
        working-directory: fractal_video
        run: |
          SILENT="$(find media -type f -name 'FractalExplainer.mp4' | head -n1)"
          test -n "$SILENT"
          ffmpeg -y -i "$SILENT" -i narration.wav \
            -map 0:v:0 -map 1:a:0 -t 1200 \
            -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p \
            -c:a aac -b:a 144k -af 'loudnorm=I=-16:TP=-1:LRA=7' \
            -movflags +faststart fractals_20min_final.mp4

      - name: Verify streams and representative frames
        working-directory: fractal_video
        run: |
          ffprobe -v error -show_entries format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,sample_rate,channels \
            -of json fractals_20min_final.mp4 > ffprobe.json
          mkdir -p qa_frames
          for T in 00:00:10 00:05:00 00:10:00 00:15:00 00:19:30; do
            SAFE="${T//:/_}"
            ffmpeg -y -loglevel error -ss "$T" -i fractals_20min_final.mp4 -frames:v 1 "qa_frames/${SAFE}.png"
          done
          python - <<'PY'
          import json, pathlib
          from PIL import Image
          import numpy as np
          rep=[]
          for p in sorted(pathlib.Path('qa_frames').glob('*.png')):
              a=np.asarray(Image.open(p).convert('RGB'))
              rep.append({'file':p.name,'mean':float(a.mean()),'std':float(a.std()),'near_black_fraction':float((a.mean(axis=2)<8).mean())})
          pathlib.Path('qa_report.json').write_text(json.dumps(rep,indent=2))
          print(json.dumps(rep,indent=2))
          PY

      - name: Package reproducible sources
        working-directory: fractal_video
        run: |
          mkdir -p deliverable/source
          cp fractals_20min_final.mp4 deliverable/
          cp fractal_video.py voice.py narration.json timings.json ffprobe.json qa_report.json deliverable/source/
          cp -r qa_frames deliverable/source/

      - name: Upload deliverable
        uses: actions/upload-artifact@v4
        with:
          name: fractals-20min-final
          path: fractal_video/deliverable
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
