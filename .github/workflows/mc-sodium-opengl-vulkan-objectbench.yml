name: Optimized Minecraft 26.2 Sodium OpenGL vs Vulkan object benchmark

on:
  push:
    paths:
      - '.github/workflows/mc-sodium-opengl-vulkan-objectbench.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  DISPLAY: ':99'
  ALSOFT_DRIVERS: 'null'

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Prepare graphics runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools mesa-utils
          python3 -m pip install --break-system-packages -q 'portablemc==4.4.1'
          Xvfb :99 -screen 0 960x540x24 -ac -noreset >xvfb.log 2>&1 &
          sleep 2
          vulkaninfo --summary >vulkaninfo.txt
          glxinfo -B >glxinfo.txt

      - name: Fetch only Fabric API and Sodium 26.2
        run: |
          set -euo pipefail
          mkdir -p modcache
          python3 - <<'PY'
          import json,urllib.request,urllib.parse,os
          mc='26.2'; seen={}
          def get(u):
              return json.load(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'objectbench/2.0'}),timeout=30))
          def add(slug):
              p=get('https://api.modrinth.com/v2/project/'+urllib.parse.quote(slug,safe=''))
              if p['id'] in seen:return
              q=urllib.parse.urlencode({'loaders':json.dumps(['fabric']),'game_versions':json.dumps([mc])})
              vs=get(f"https://api.modrinth.com/v2/project/{p['id']}/version?{q}")
              if not vs:raise RuntimeError('no 26.2 Fabric build '+slug)
              v=next((x for x in vs if x.get('version_type')=='release'),vs[0]); f=next((x for x in v['files'] if x.get('primary')),v['files'][0])
              urllib.request.urlretrieve(f['url'],'modcache/'+f['filename'])
              seen[p['id']]={'slug':p['slug'],'version':v['version_number'],'file':f['filename']}
              print('USE',p['slug'],v['version_number'],f['filename'])
              for d in v.get('dependencies',[]):
                  if d.get('dependency_type')=='required' and d.get('project_id'):
                      add(get('https://api.modrinth.com/v2/project/'+d['project_id'])['slug'])
          add('fabric-api'); add('sodium')
          json.dump(list(seen.values()),open('modcache/manifest.json','w'),indent=2)
          PY
          cat modcache/manifest.json

      - name: Build deterministic multi-scene FrameBench
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch 26.2 https://github.com/FabricMC/fabric-example-mod.git framebench
          cd framebench
          rm -rf src/main/java src/client/java src/main/resources/* src/client/resources/*
          mkdir -p src/client/java/bench src/main/resources
          sed -i 's/"modid"/"objectbench"/g' build.gradle
          cat > src/main/resources/fabric.mod.json <<'EOF'
          {"schemaVersion":1,"id":"objectbench","version":"2.0.0","name":"ObjectBench","environment":"client","entrypoints":{"client":["bench.ObjectBenchClient"]},"depends":{"fabricloader":">=0.19.3","minecraft":"~26.2","java":">=25","fabric-api":"*"}}
          EOF
          cat > src/client/java/bench/ObjectBenchClient.java <<'JAVA'
          package bench;

          import java.nio.file.*;
          import java.util.*;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.rendering.v1.level.LevelRenderEvents;
          import net.fabricmc.loader.api.FabricLoader;

          public final class ObjectBenchClient implements ClientModInitializer {
            static final String[] NAMES={"geometry_transparency","occlusion_entities","mixed_block_entities"};
            static final double[][] START={{-36,12,-40},{124,11,-40},{284,12,-40}};
            static final double[][] END={{36,12,-40},{196,11,-40},{356,12,-40}};
            static final long INITIAL=10_000_000_000L, WARM=4_000_000_000L, MEASURE=12_000_000_000L, SCENE=WARM+MEASURE;
            @SuppressWarnings("unchecked") static final List<Long>[] S=new List[]{new ArrayList<>(),new ArrayList<>(),new ArrayList<>()};
            static final List<Long> ALL=new ArrayList<>();
            static long boot=0,lastFrame=0; static boolean done=false; static Path out; static String run;

            @Override public void onInitializeClient(){
              out=FabricLoader.getInstance().getGameDir().resolve("objectbench-result.json");
              run=System.getenv().getOrDefault("BENCH_RUN","unknown");
              try{Files.deleteIfExists(out);}catch(Exception ignored){}
              ClientTickEvents.END_CLIENT_TICK.register(client->{
                if(done||client.player==null||client.level==null)return;
                long now=System.nanoTime(); if(boot==0){boot=now;System.out.println("OBJECTBENCH WORLD READY "+run);return;}
                long e=now-boot; if(e<INITIAL)return; long q=e-INITIAL; int scene=(int)(q/SCENE);
                if(scene>=NAMES.length){done=true;write();return;}
                long within=q%SCENE; double p=Math.min(1.0,within/(double)SCENE);
                double x=START[scene][0]+(END[scene][0]-START[scene][0])*p;
                double y=START[scene][1]; double z=START[scene][2];
                client.player.setPos(x,y,z);
                client.player.setYRot((float)(Math.sin(p*Math.PI*2.0)*7.0));
                client.player.setXRot(-3.0f);
              });
              LevelRenderEvents.END_MAIN.register(ctx->frame());
              System.out.println("OBJECTBENCH READY "+run);
            }

            static void frame(){
              long now=System.nanoTime(); if(lastFrame==0){lastFrame=now;return;} long dt=now-lastFrame;lastFrame=now;
              if(done||boot==0||dt<=0||dt>=2_000_000_000L)return;
              long e=now-boot; if(e<INITIAL)return; long q=e-INITIAL; int scene=(int)(q/SCENE); if(scene<0||scene>=NAMES.length)return;
              long within=q%SCENE; if(within>=WARM){S[scene].add(dt);ALL.add(dt);}
            }

            static Map<String,Object> metric(List<Long> in){
              Map<String,Object> m=new LinkedHashMap<>(); if(in.isEmpty()){m.put("samples",0);return m;}
              List<Long>x=new ArrayList<>(in);Collections.sort(x);long sum=0;for(long v:in)sum+=v;
              m.put("samples",in.size());m.put("mean_fps",in.size()*1e9/sum);m.put("median_fps",1e9/p(x,.5));
              m.put("one_percent_low_fps",1e9/p(x,.99));m.put("zero_point_one_percent_low_fps",1e9/p(x,.999));m.put("p99_frame_ms",p(x,.99)/1e6);return m;
            }
            static long p(List<Long>x,double q){int i=(int)Math.ceil(q*x.size())-1;return x.get(Math.max(0,Math.min(x.size()-1,i)));}
            static String num(Object o){return o instanceof Number?String.format(Locale.ROOT,"%.5f",((Number)o).doubleValue()):"0";}
            static String metricJson(Map<String,Object>m){return String.format(Locale.ROOT,"{\"samples\":%d,\"mean_fps\":%s,\"median_fps\":%s,\"one_percent_low_fps\":%s,\"zero_point_one_percent_low_fps\":%s,\"p99_frame_ms\":%s}",((Number)m.getOrDefault("samples",0)).intValue(),num(m.get("mean_fps")),num(m.get("median_fps")),num(m.get("one_percent_low_fps")),num(m.get("zero_point_one_percent_low_fps")),num(m.get("p99_frame_ms")));}
            static void write(){try{
              StringBuilder b=new StringBuilder();b.append("{\"run\":\"").append(run).append("\",\"overall\":").append(metricJson(metric(ALL))).append(",\"scenes\":{");
              for(int i=0;i<NAMES.length;i++){if(i>0)b.append(',');b.append('\"').append(NAMES[i]).append("\":").append(metricJson(metric(S[i])));}
              b.append("}}\n");Files.writeString(out,b.toString());System.out.println("OBJECTBENCH DONE "+b);
            }catch(Exception e){e.printStackTrace();}}
          }
          JAVA
          ./gradlew build --no-daemon -q
          cp $(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -1) ../modcache/objectbench.jar

      - name: Generate optimized deterministic benchmark world
        run: |
          set -euo pipefail
          mkdir worldgen && cd worldgen
          python3 - <<'PY'
          import json,urllib.request
          m=json.load(urllib.request.urlopen('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'))
          u=next(x['url'] for x in m['versions'] if x['id']=='26.2');v=json.load(urllib.request.urlopen(u));urllib.request.urlretrieve(v['downloads']['server']['url'],'server.jar')
          PY
          echo eula=true >eula.txt
          cat >server.properties <<'EOF'
          level-name=benchworld
          level-seed=7608123456789
          level-type=minecraft:flat
          gamemode=creative
          difficulty=peaceful
          online-mode=false
          view-distance=12
          simulation-distance=8
          spawn-protection=0
          EOF
          coproc MC { java -Xms1G -Xmx2G -jar server.jar nogui >server.log 2>&1; }
          for i in $(seq 1 90);do grep -q 'Done (' server.log&&break;sleep 1;done
          grep 'Done (' server.log
          exec 3>&${MC[1]}
          cmd(){ printf '%s\n' "$1" >&3; sleep .04; }
          cmd 'gamerule randomTickSpeed 0'; cmd 'gamerule doMobSpawning false'; cmd 'gamerule doWeatherCycle false'; cmd 'gamerule doDaylightCycle false'; cmd 'time set noon'; cmd 'weather clear';
          # Scene 1: geometry + transparency + non-cubic face complexity
          cmd 'fill -48 3 -48 48 3 48 minecraft:smooth_stone'
          cmd 'fill -40 4 -5 40 15 -3 minecraft:oak_leaves'
          cmd 'fill -40 4 2 40 15 4 minecraft:glass'
          cmd 'fill -40 4 9 40 12 11 minecraft:oak_fence'
          cmd 'fill -40 4 16 40 12 18 minecraft:iron_bars'
          cmd 'fill -40 4 23 40 12 25 minecraft:cobblestone_wall'
          cmd 'fill -40 4 30 40 10 32 minecraft:stone_stairs'
          cmd 'fill -40 4 37 40 8 39 minecraft:oak_trapdoor'
          # Scene 2: opaque occluder with hidden entities and block entities behind it
          cmd 'fill 112 3 -48 208 3 48 minecraft:smooth_stone'
          cmd 'fill 120 4 -5 200 20 -3 minecraft:stone'
          cmd 'fill 136 8 -5 143 14 -3 minecraft:air'
          cmd 'fill 160 8 -5 167 14 -3 minecraft:air'
          cmd 'fill 184 8 -5 191 14 -3 minecraft:air'
          cmd 'fill 132 4 22 188 9 24 minecraft:barrel'
          # Scene 3: visible mixed geometry + block entities
          cmd 'fill 272 3 -48 368 3 48 minecraft:smooth_stone'
          cmd 'fill 280 4 3 360 10 5 minecraft:glass'
          cmd 'fill 280 4 10 360 12 12 minecraft:oak_leaves'
          cmd 'fill 280 4 17 360 10 19 minecraft:iron_bars'
          cmd 'fill 288 4 27 352 9 29 minecraft:barrel'
          cmd 'fill 288 4 35 352 8 37 minecraft:oak_fence'
          # Deterministic no-AI entity grids: mostly hidden in scene 2, visible in scene 3
          for x in $(seq 126 6 198);do for z in $(seq 4 4 32);do cmd "summon minecraft:cow $x 4 $z {NoAI:1b,Silent:1b,Invulnerable:1b,PersistenceRequired:1b}";done;done
          for x in $(seq 286 8 358);do for z in $(seq -2 5 23);do cmd "summon minecraft:cow $x 4 $z {NoAI:1b,Silent:1b,Invulnerable:1b,PersistenceRequired:1b}";done;done
          # Pregenerate/load every benchmark scene so steady-state render is not polluted by chunk generation.
          cmd 'forceload add -64 -64 64 64'
          cmd 'forceload add 96 -64 224 64'
          cmd 'forceload add 256 -64 384 64'
          cmd 'save-all flush'; sleep 10; cmd 'save-all flush'; sleep 3; cmd 'stop'
          wait ${MC_PID} || true
          cd ..; mkdir -p world-template; cp -a worldgen/benchworld/. world-template/
          du -sh world-template

      - name: Resolve Fabric metadata
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.minecraft/mods"
          cp modcache/*.jar "$HOME/.minecraft/mods/"
          set +e
          timeout 35s portablemc start -u BenchUser fabric:26.2 >resolve.log 2>&1 & p=$!
          for i in $(seq 1 35);do find "$HOME/.minecraft/versions" -type f -name '*fabric*26.2*.json'|grep -q .&&break;sleep 1;done
          kill -TERM $p 2>/dev/null||true; pkill -f 'KnotClient|net.minecraft.client.main.Main' 2>/dev/null||true; sleep 2
          set -e
          find "$HOME/.minecraft/versions" -type f -name '*26.2*.json' -print

      - name: Run same-runner ABBAAB comparison
        run: |
          set -euo pipefail
          mkdir -p raw-results logs "$HOME/.minecraft/saves"
          cat > "$HOME/.minecraft/options.txt" <<'EOF'
          fullscreen:false
          enableVsync:false
          maxFps:260
          renderDistance:10
          simulationDistance:8
          guiScale:2
          pauseOnLostFocus:false
          graphicsMode:1
          clouds:false
          entityDistanceScaling:1.0
          mipmapLevels:2
          narrator:0
          bobView:false
          EOF
          python3 - <<'PY'
          import os,glob,json,shutil,subprocess,time
          home=os.path.expanduser('~/.minecraft'); root=os.getcwd()
          versions=glob.glob(home+'/versions/**/*fabric*26.2*.json',recursive=True)
          if not versions: raise SystemExit('fabric 26.2 metadata not found')
          vf=versions[0]; print('VERSION_JSON',vf)
          order=[('opengl',1),('vulkan',1),('vulkan',2),('opengl',2),('opengl',3),('vulkan',3)]
          rows=[]
          def patch(backend):
              d=json.load(open(vf)); a=d.setdefault('arguments',{}).setdefault('game',[]); out=[]; i=0
              while i<len(a):
                  if isinstance(a[i],str) and a[i] in ('--graphicsBackend','--quickPlaySingleplayer'):
                      i+=2; continue
                  out.append(a[i]); i+=1
              out += ['--graphicsBackend',backend,'--quickPlaySingleplayer','benchworld']
              d['arguments']['game']=out; json.dump(d,open(vf,'w'),indent=2)
          for backend,rep in order:
              tag=f'{backend}_{rep}'; print('\n===== '+tag+' =====',flush=True); patch(backend)
              save=home+'/saves/benchworld'; shutil.rmtree(save,ignore_errors=True); shutil.copytree('world-template',save)
              result=home+'/objectbench-result.json'
              try:os.remove(result)
              except:pass
              env=os.environ.copy();env['BENCH_RUN']=tag
              logp='logs/'+tag+'.log'; log=open(logp,'w')
              p=subprocess.Popen(['portablemc','start','-u','BenchUser','fabric:26.2'],stdout=log,stderr=subprocess.STDOUT,env=env)
              valid=False; deadline=time.time()+105
              while time.time()<deadline:
                  txt=open(logp,errors='ignore').read() if os.path.exists(logp) else ''
                  if backend=='vulkan' and ('Failed to create backend Vulkan' in txt or 'Using graphics backend OpenGL' in txt): break
                  if backend=='opengl' and 'Using graphics backend Vulkan' in txt: break
                  proof=('Using graphics backend Vulkan' in txt) if backend=='vulkan' else ('Using graphics backend OpenGL' in txt)
                  if proof: valid=True
                  if os.path.exists(result): break
                  if p.poll() is not None: break
                  time.sleep(1)
              if os.path.exists(result) and valid:
                  d=json.load(open(result));d['backend']=backend;d['rep']=rep;d['backend_proven']=True;rows.append(d)
                  json.dump(d,open('raw-results/'+tag+'.json','w'),indent=2); print('RESULT',json.dumps(d),flush=True)
              else:
                  txt=open(logp,errors='ignore').read() if os.path.exists(logp) else ''
                  rows.append({'run':tag,'backend':backend,'rep':rep,'status':'invalid_or_no_result','tail':txt[-3000:]});print('INVALID',tag,flush=True)
              p.terminate()
              try:p.wait(timeout=8)
              except: p.kill()
              log.close();time.sleep(3)
          json.dump(rows,open('raw-results/all.json','w'),indent=2)
          PY

      - name: Aggregate comparison
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          python3 - <<'PY'
          import json,statistics,csv
          rows=json.load(open('raw-results/all.json')); good=[x for x in rows if 'overall' in x]
          if len(good)<4: raise SystemExit('too few valid runs: '+str(len(good)))
          scene_names=['overall','geometry_transparency','occlusion_entities','mixed_block_entities']
          def metric(r,s): return r['overall'] if s=='overall' else r['scenes'][s]
          agg={}
          for backend in ['opengl','vulkan']:
              rs=[r for r in good if r['backend']==backend]; agg[backend]={'valid_runs':len(rs),'scenes':{}}
              for s in scene_names:
                  fps=[metric(r,s)['mean_fps'] for r in rs]; low=[metric(r,s)['one_percent_low_fps'] for r in rs]; p99=[metric(r,s)['p99_frame_ms'] for r in rs]
                  agg[backend]['scenes'][s]={'median_mean_fps':statistics.median(fps),'min_mean_fps':min(fps),'max_mean_fps':max(fps),'median_1pct_low_fps':statistics.median(low),'median_p99_frame_ms':statistics.median(p99)}
          cmp={}
          for s in scene_names:
              o=agg['opengl']['scenes'][s]['median_mean_fps'];v=agg['vulkan']['scenes'][s]['median_mean_fps'];cmp[s]={'vulkan_vs_opengl_pct':(v/o-1)*100,'opengl_fps':o,'vulkan_fps':v}
          payload={'minecraft':'26.2','mods':['fabric-api','sodium'],'method':'optimized deterministic 3-scene object benchmark; same runner; ABBAAB; quickPlay; programmatic camera; pregenerated chunks','valid_runs':len(good),'aggregate':agg,'comparison':cmp,'raw_runs':good}
          json.dump(payload,open('benchmark-results/mc-26.2-sodium-opengl-vs-vulkan-objectbench.json','w'),indent=2)
          with open('benchmark-results/mc-26.2-sodium-opengl-vs-vulkan-objectbench.csv','w',newline='') as f:
              w=csv.writer(f);w.writerow(['scene','opengl_median_fps','vulkan_median_fps','vulkan_vs_opengl_pct'])
              for s,c in cmp.items():w.writerow([s,c['opengl_fps'],c['vulkan_fps'],c['vulkan_vs_opengl_pct']])
          print(json.dumps(payload['comparison'],indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add benchmark-results/mc-26.2-sodium-opengl-vs-vulkan-objectbench.json benchmark-results/mc-26.2-sodium-opengl-vs-vulkan-objectbench.csv
          git commit -m 'Record optimized Sodium OpenGL vs Vulkan object benchmark' || true
          git push || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sodium-opengl-vulkan-objectbench
          path: |
            raw-results/
            logs/
            benchmark-results/mc-26.2-sodium-opengl-vs-vulkan-objectbench.*
            modcache/manifest.json
            glxinfo.txt
            vulkaninfo.txt
            xvfb.log
            worldgen/server.log
          if-no-files-found: warn
          retention-days: 3
