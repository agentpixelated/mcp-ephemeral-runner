name: Tokopedia direct GraphQL probe

on:
  push:
    paths:
      - 'agent-runtime/tokopedia-direct-probe-request.json'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe Tokopedia GraphQL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tokopedia-results
          node agent-runtime/tokopedia-direct-probe.mjs > tokopedia-results/direct-probe.json
      - name: Persist result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tokopedia-results/direct-probe.json
          git commit -m 'chore: update Tokopedia direct probe' || exit 0
          git push
