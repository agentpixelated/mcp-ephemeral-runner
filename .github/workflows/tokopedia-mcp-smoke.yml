name: Tokopedia MCP smoke

on:
  push:
    paths:
      - 'agent-runtime/dispatch/tokopedia-*.json'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dispatch file
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          file="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^agent-runtime/dispatch/tokopedia-.*\.json$' | tail -n 1)"
          test -n "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "id=$(basename "$file" .json)" >> "$GITHUB_OUTPUT"
      - name: Run Tokopedia MCP job
        run: node agent-runtime/run-job-file.mjs "${{ steps.dispatch.outputs.file }}"
      - name: Persist latest result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tokopedia-results
          src="agent-runtime/results/${{ steps.dispatch.outputs.id }}.json"
          if [[ -f "$src" ]]; then
            cp "$src" tokopedia-results/latest.json
          else
            printf '{"status":"failed","error":"result file missing"}\n' > tokopedia-results/latest.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tokopedia-results/latest.json
          git commit -m 'chore: update Tokopedia MCP result' || exit 0
          git push
