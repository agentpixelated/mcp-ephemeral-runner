name: temp-social-matrix

on:
  push:
    branches:
      - temp-social-matrix-20260830

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser required by Playwright MCP
        run: npx -y @playwright/mcp install-browser chrome-for-testing

      - name: Configure ephemeral Playwright MCP
        run: |
          cat > /tmp/playwright-mcp.json <<'JSON'
          {
            "command": "npx",
            "args": ["-y", "@playwright/mcp", "--headless", "--browser", "chromium"],
            "timeoutMs": 180000
          }
          JSON

      - name: Build focused social research workflow
        run: |
          mkdir -p temp-social-results
          cat > /tmp/research-workflow.json <<'JSON'
          [
            {
              "tool": "browser_run_code_unsafe",
              "timeoutMs": 180000,
              "arguments": {
                "code": "async (page) => { const norm=s=>(s||'').split(/\\s+/).join(' ').trim(); const out={searchedAt:new Date().toISOString(),duckduckgo:[],instagramApi:null,tiktok:null}; const queries=[\"\\\"MATRIX UI 2026\\\" voucher\",\"\\\"MATRIX UI 2026\\\" promo\",\"\\\"MATRIX UI 2026\\\" diskon\",\"site:instagram.com \\\"matrixui.2026\\\"\",\"site:instagram.com \\\"MATRIX UI 2026\\\" voucher\",\"site:tiktok.com \\\"MATRIX UI 2026\\\"\",\"\\\"matrixui.2026\\\" ambassador\",\"\\\"matrixui.2026\\\" \\\"media partner\\\"\"]; for(const q of queries){ try{ await page.goto('https://html.duckduckgo.com/html/?q='+encodeURIComponent(q),{waitUntil:'domcontentloaded',timeout:30000}); await page.waitForTimeout(700); const rows=await page.locator('.result').evaluateAll(rs=>rs.slice(0,15).map(r=>({text:(r.innerText||'').split(/\\s+/).join(' ').trim().slice(0,1200),href:(r.querySelector('a.result__a')||{}).href||''}))); const body=norm(await page.locator('body').innerText()).slice(0,3000); out.duckduckgo.push({q,title:await page.title(),body,rows}); }catch(e){ out.duckduckgo.push({q,error:String(e)}); } } try{ const r=await page.request.get('https://www.instagram.com/api/v1/users/web_profile_info/?username=matrixui.2026',{headers:{'x-ig-app-id':'936619743392459','user-agent':'Mozilla/5.0'}}); const tx=await r.text(); let parsed=null; try{parsed=JSON.parse(tx);}catch{} const u=parsed&&parsed.data&&parsed.data.user; out.instagramApi={status:r.status(),ok:r.ok(),text:tx.slice(0,1200),user:u?{username:u.username,full_name:u.full_name,biography:u.biography,is_private:u.is_private,followers:u.edge_followed_by&&u.edge_followed_by.count,posts:((u.edge_owner_to_timeline_media&&u.edge_owner_to_timeline_media.edges)||[]).slice(0,12).map(e=>({shortcode:e.node&&e.node.shortcode,caption:((((e.node||{}).edge_media_to_caption||{}).edges||[])[0]||{node:{}}).node.text||'',display_url:e.node&&e.node.display_url,taken_at:e.node&&e.node.taken_at_timestamp}))}:null}; }catch(e){ out.instagramApi={error:String(e)}; } try{ const responses=[]; page.on('response',async r=>{ const u=r.url().toLowerCase(); if((u.includes('search')||u.includes('general')||u.includes('/api/'))&&responses.length<40){ let text=''; try{text=(await r.text()).slice(0,3500);}catch{} responses.push({url:r.url(),status:r.status(),text}); } }); await page.goto('https://www.tiktok.com/search?q='+encodeURIComponent('MATRIX UI 2026'),{waitUntil:'domcontentloaded',timeout:30000}); await page.waitForTimeout(5000); const body=norm(await page.locator('body').innerText().catch(()=>'' )).slice(0,4000); const scripts=await page.locator('script').allTextContents(); out.tiktok={url:page.url(),title:await page.title(),body,responses:responses.slice(0,25),scripts:scripts.filter(s=>{const l=s.toLowerCase(); return l.includes('matrix')||l.includes('itemlist')||l.includes('userlist');}).slice(0,8).map(s=>s.slice(0,7000))}; }catch(e){ out.tiktok={error:String(e)}; } return JSON.stringify(out); }"
              }
            }
          ]
          JSON

      - name: Run temporary MCP focused research
        run: |
          node src/cli.mjs workflow /tmp/playwright-mcp.json /tmp/research-workflow.json > temp-social-results/matrix-social-focused.json

      - uses: actions/upload-artifact@v4
        with:
          name: temp-social-matrix-focused-fixed
          path: temp-social-results/
          retention-days: 1
