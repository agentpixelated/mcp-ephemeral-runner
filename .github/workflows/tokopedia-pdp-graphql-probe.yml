name: Tokopedia PDP GraphQL probe

on:
  push:
    paths:
      - 'agent-runtime/tokopedia-pdp-graphql-request.json'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe PDP GraphQL
        shell: bash
        run: |
          set +e
          mkdir -p tokopedia-results
          timeout --signal=TERM 60s node agent-runtime/tokopedia-pdp-graphql-probe.mjs agent-runtime/tokopedia-pdp-graphql-request.json > tokopedia-results/pdp-graphql.json 2> tokopedia-results/pdp-graphql.stderr.txt
          printf '%s\n' "$?" > tokopedia-results/pdp-graphql.exit-code.txt
          exit 0
      - name: Persist probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tokopedia-results/pdp-graphql.json tokopedia-results/pdp-graphql.stderr.txt tokopedia-results/pdp-graphql.exit-code.txt
          git commit -m 'chore: update Tokopedia PDP GraphQL probe' || exit 0
          git push
