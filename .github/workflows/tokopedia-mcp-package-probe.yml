name: Tokopedia MCP package probe

on:
  push:
    paths:
      - 'agent-runtime/tokopedia-mcp-package-probe-request.json'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run MCP package through ephemeral runner
        shell: bash
        run: |
          set +e
          mkdir -p tokopedia-results
          timeout --signal=TERM 90s node src/cli.mjs call examples/tokopedia.json search_products '{"query":"iphone 11 second","rows":5,"orderBy":3,"priceMax":3000000}' > tokopedia-results/mcp-package-stdout.txt 2> tokopedia-results/mcp-package-stderr.txt
          code=$?
          printf '%s\n' "$code" > tokopedia-results/mcp-package-exit-code.txt
          exit 0
      - name: Persist package probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tokopedia-results/mcp-package-stdout.txt tokopedia-results/mcp-package-stderr.txt tokopedia-results/mcp-package-exit-code.txt
          git commit -m 'chore: update Tokopedia MCP package probe' || exit 0
          git push
