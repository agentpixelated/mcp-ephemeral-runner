name: Free benchmark runners

on:
  push:
    paths:
      - '.github/workflows/mc-benchmark-cleanup.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel obsolete runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run cancel 32090408886 || true
          gh run cancel 32091261533 || true
          gh run cancel 32090256219 || true
          echo 'Freed runners from old Sodium fallback and completed-enough VulkanMod matrix.'
